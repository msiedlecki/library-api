services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-library}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-library}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - .git/
            - log/
            - tmp/
            - storage/
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      SOLID_QUEUE_IN_PUMA: "true"
      TZ: Europe/Warsaw
      DB_HOST: db
      DB_USER: ${DB_USER:-library}
      DB_PASSWORD: ${DB_PASSWORD:-library}
      BINDING: 0.0.0.0

volumes:
  pgdata: