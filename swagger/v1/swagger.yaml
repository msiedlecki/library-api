---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/books/{serial_number}/borrow":
    post:
      summary: creates a current loan
      tags:
      - Books
      parameters:
      - name: serial_number
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: creates a current loan and stores the reader data
          content:
            application/json:
              examples:
                book_borrowed:
                  value:
                    borrowed_at: '2026-10-12T08:00:00.000Z'
                    due_on: '2026-11-11'
                    reader:
                      card_number: '123456'
                      full_name: Jane Doe
                      email: jane@example.com
                  summary: Book borrowed
        '409':
          description: returns conflict when the book is already borrowed
          content:
            application/json:
              examples:
                book_already_borrowed:
                  value:
                    error:
                      code: currently_borrowed
                      details: {}
                  summary: Book already borrowed
        '404':
          description: returns not found when the book has been discarded
          content:
            application/json:
              examples:
                discarded_book:
                  value:
                    error:
                      code: not_found
                      details: {}
                  summary: Discarded book
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reader:
                  type: object
                  properties:
                    card_number:
                      type: string
                    full_name:
                      type: string
                    email:
                      type: string
                  required:
                  - card_number
                  - full_name
                  - email
              required:
              - reader
        required: true
  "/books":
    post:
      summary: registers a book
      tags:
      - Books
      parameters: []
      responses:
        '201':
          description: creates a book
          content:
            application/json:
              examples:
                book_created:
                  value:
                    serial_number: '123456'
                    title: The Hobbit
                    author: J. R. R. Tolkien
                    status: available
                    current_loan:
                  summary: Book created
        '422':
          description: keeps the serial number of a discarded book reserved
          content:
            application/json:
              examples:
                invalid_book_attributes:
                  value:
                    error:
                      code: validation_failed
                      details:
                        serial_number:
                        - is invalid
                        title:
                        - can't be blank
                  summary: Invalid book attributes
                serial_number_taken:
                  value:
                    error:
                      code: validation_failed
                      details:
                        serial_number:
                        - is already taken or reserved
                  summary: Serial number already taken
                discarded_serial_number_reserved:
                  value:
                    error:
                      code: validation_failed
                      details:
                        serial_number:
                        - is already taken or reserved
                  summary: Discarded serial number reserved
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                serial_number:
                  type: string
                title:
                  type: string
                author:
                  type: string
              required:
              - serial_number
              - title
              - author
        required: true
    get:
      summary: lists active books
      tags:
      - Books
      responses:
        '200':
          description: caps per_page at 100
          content:
            application/json:
              examples:
                list_books_default:
                  value:
                    data:
                    - serial_number: '000001'
                      title: First
                      status: available
                      current_loan:
                    - serial_number: '000003'
                      title: Third
                      status: available
                      current_loan:
                    meta:
                      page: 1
                      per_page: 25
                      total: 2
                  summary: List books
                borrowed_books:
                  value:
                    data:
                    - serial_number: '000012'
                      status: borrowed
                      current_loan:
                        borrowed_at: '2026-10-12T08:00:00.000Z'
                        due_on: '2026-11-11'
                        reader:
                          card_number: '1001'
                          full_name: Jane Doe
                          email: jane@example.com
                    meta:
                      page: 1
                      per_page: 25
                      total: 1
                  summary: Borrowed books
                available_books:
                  value:
                    data:
                    - serial_number: '000010'
                      title: Available
                      status: available
                      current_loan:
                    - serial_number: '000011'
                      title: Returned
                      status: available
                      current_loan:
                    meta:
                      page: 1
                      per_page: 25
                      total: 2
                  summary: Available books
                paged_books:
                  value:
                    data:
                    - serial_number: '000005'
                      title: Book 5
                      status: available
                      current_loan:
                    meta:
                      page: 3
                      per_page: 2
                      total: 5
                  summary: Paginated books
                per_page_capped:
                  value:
                    data:
                    - serial_number: '000001'
                      title: Book 1
                      status: available
                      current_loan:
                    meta:
                      page: 1
                      per_page: 100
                      total: 1
                  summary: Per page capped
        '422':
          description: returns details for every invalid list parameter
          content:
            application/json:
              examples:
                invalid_list_params:
                  value:
                    error:
                      code: invalid_params
                      details:
                        status:
                        - 'must be one of: available, borrowed'
                        page:
                        - must be a positive integer
                        per_page:
                        - must be a positive integer
                  summary: Invalid list parameters
        '500':
          description: returns 500 internal_error without leaking details
          content:
            application/json:
              examples:
                internal_error:
                  value:
                    error:
                      code: internal_error
                      details: {}
                  summary: Internal error
  "/books/{serial_number}":
    delete:
      summary: marks a book as discarded
      tags:
      - Books
      parameters:
      - name: serial_number
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: marks an active book as discarded
          content:
            application/json:
              examples:
                book_discarded_delete:
                  summary: Book discarded
        '404':
          description: returns not_found for a discarded book
          content:
            application/json:
              examples:
                discarded_book_delete:
                  value:
                    error:
                      code: not_found
                      details: {}
                  summary: Book discarded
        '409':
          description: returns conflict when a book is currently borrowed
          content:
            application/json:
              examples:
                book_currently_borrowed_delete:
                  value:
                    error:
                      code: currently_borrowed
                      details: {}
                  summary: Book currently borrowed
    get:
      summary: returns a book detail
      tags:
      - Books
      parameters:
      - name: serial_number
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: returns the current loan and the loan history
          content:
            application/json:
              examples:
                book_detail:
                  value:
                    serial_number: '123456'
                    status: borrowed
                    current_loan:
                      borrowed_at: '2026-10-01T10:00:00.000Z'
                      due_on: '2026-10-31'
                      reader:
                        card_number: '1001'
                        full_name: Jane Doe
                        email: jane@example.com
                    loans:
                    - borrowed_at: '2026-10-01T10:00:00.000Z'
                      returned_at:
                      reader:
                        card_number: '1001'
                        full_name: Jane Doe
                        email: jane@example.com
                    - borrowed_at: '2026-09-30T10:00:00.000Z'
                      returned_at: '2026-10-01T09:00:00.000Z'
                      reader:
                        card_number: '1001'
                        full_name: Jane Doe
                        email: jane@example.com
                  summary: Book detail
        '404':
          description: malformed serial_number or discarded book
          content:
            application/json:
              examples:
                malformed_serial_number:
                  value:
                    error:
                      code: not_found
                      details: {}
                  summary: Malformed serial number
                discarded_book:
                  value:
                    error:
                      code: not_found
                      details: {}
                  summary: Discarded book
  "/books/{serial_number}/return":
    post:
      summary: marks the active loan as returned
      tags:
      - Books
      parameters:
      - name: serial_number
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: marks the active loan as returned
          content:
            application/json:
              examples:
                loan_returned:
                  value:
                    borrowed_at: '2026-10-10T10:00:00.000Z'
                    returned_at: '2026-10-12T10:00:00.000Z'
                    reader:
                      card_number: '1001'
                      full_name: Jane Doe
                      email: jane@example.com
                  summary: Loan returned
        '404':
          description: returns not_found when the book cannot be returned
          content:
            application/json:
              examples:
                malformed_serial_number_return:
                  value:
                    error:
                      code: not_found
                      details: {}
                  summary: Malformed serial number
                no_active_loan_return:
                  value:
                    error:
                      code: not_found
                      details: {}
                  summary: No active loan to return
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
